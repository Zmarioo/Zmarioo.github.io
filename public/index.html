<script>
  const params = new URLSearchParams(window.location.search);
  const username = params.get('user');
  const avatar = params.get('avatar');

  if (username) {
    const authArea = document.getElementById('auth-area');
    if (authArea) {
      authArea.innerHTML = `
        <div class="user-info" style="text-align: center;">
          ${avatar ? `<img src="${avatar}" alt="${username}" style="width: 70px; height: 70px; border-radius: 50%; margin-bottom: 10px;">` : ''}
          <h3>Bem-vindo, ${username}!</h3>
          <p><strong>Status:</strong> Autenticado com sucesso via GitHub</p>
          <a href="/" style="display: inline-block; margin-top: 10px; color: #dc3545; text-decoration: none;">Sair</a>
        </div>
      `;
    }
  }
</script>
